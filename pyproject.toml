[project]
name = "vista"
version = "1.0.0"
description = "Full-stack application for image management, classification, and collaboration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "python-dotenv",
    "pydantic-settings",
    "minio",
    "python-multipart",
    "httpx",
    "aiocache",
    "Pillow",
    "boto3==1.35.99",
    "requests",
    "diskcache",
    "swagger-ui-bundle",
    "fastmcp",
    "openpyxl",
    "numpy>=2.4.4",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "podman-compose",
    "numpy>=2.4.4",
    "pytest-xdist",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "podman-compose",
    "numpy>=2.4.4",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "smoke: representative backend user workflows for fast local validation",
    "postgres: opt-in Alembic-backed PostgreSQL integration contracts (serial only)",
    "load: scheduled high-volume backend contracts excluded from the fast suite",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "--tb=short --show-capture=no"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "docs*"]
