name: "Security Scanning"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays at 2 AM

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: security-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generate and publish the report before enforcing the same severity
      # policy so findings remain available when the final scan fails.
      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'security-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: false

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scan'

      - name: Upload Trivy scan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Trivy HIGH and CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          image-ref: 'security-scan:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "safety==3.8.1" \
            "bandit==1.9.4" \
            "semgrep==1.170.0"

      - name: Run Safety (Python dependency vulnerability scanner)
        if: always()
        shell: bash
        run: |
          mkdir -p security-scan-status
          set +e
          uv export --frozen --no-dev --no-hashes --output-file /tmp/vista-runtime-requirements.txt \
            2>&1 | tee safety-export.log
          export_status=${PIPESTATUS[0]}
          if [ "$export_status" -eq 0 ]; then
            safety check -r /tmp/vista-runtime-requirements.txt \
              --output json \
              2> >(tee safety-scan.log >&2) | tee safety-results.json
            scan_status=${PIPESTATUS[0]}
          else
            scan_status=$export_status
            printf '%s\n' "Safety did not run because the locked dependency export failed." \
              > safety-scan.log
          fi
          set -e
          printf '%s\n' "$scan_status" > security-scan-status/safety.exit-code

      - name: Run Bandit (Python security linter)
        if: always()
        working-directory: ./backend
        shell: bash
        run: |
          mkdir -p ../security-scan-status
          set +e
          bandit -r . -x ./tests -ll -ii -f json -o bandit-results.json \
            2>&1 | tee bandit-scan.log
          scan_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$scan_status" > ../security-scan-status/bandit.exit-code

      - name: Run Semgrep (Static analysis for security bugs)
        if: always()
        shell: bash
        run: |
          mkdir -p security-scan-status
          set +e
          semgrep --config=p/security-audit \
            --severity WARNING --severity ERROR --error \
            --json --output=semgrep-results.json backend \
            2>&1 | tee semgrep-scan.log
          scan_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$scan_status" > security-scan-status/semgrep.exit-code

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            safety-results.json
            safety-export.log
            safety-scan.log
            backend/bandit-results.json
            backend/bandit-scan.log
            semgrep-results.json
            semgrep-scan.log
            security-scan-status/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Python security scan results
        if: always()
        shell: bash
        run: |
          failed=0
          for scanner in safety bandit semgrep; do
            status_file="security-scan-status/${scanner}.exit-code"
            if [ ! -f "$status_file" ]; then
              echo "::error::${scanner} did not produce an exit status."
              failed=1
              continue
            fi
            scan_status=$(<"$status_file")
            if [ "$scan_status" != "0" ]; then
              echo "::error::${scanner} security gate failed with exit code ${scan_status}. Inspect the uploaded scan artifact."
              failed=1
            fi
          done
          exit "$failed"
